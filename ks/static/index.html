<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kickstarter 数据查询</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6ea; --text:#1a1d21; --muted:#6b7280;
  --accent:#05ce78; --accent-dim:#e6f9f1; --danger:#e5484d; --warn:#f5a524;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1d2024; --line:#2e3238; --text:#e8eaed; --muted:#9aa1ab;
    --accent:#05ce78; --accent-dim:#123026;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0;font-weight:600}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:6px 14px;border-radius:var(--radius);border:1px solid transparent;
  cursor:pointer;color:var(--muted);background:none;font-size:13px}
.tab.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.meta{font-size:12px;color:var(--muted)}
main{padding:16px 20px 60px}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
input,select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--text);font-size:13px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.acts{display:flex;gap:8px;align-items:flex-end;grid-column:1/-1;flex-wrap:wrap}
button{padding:8px 16px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;font-size:13px}
button.primary{background:var(--accent);color:#04231a;border-color:var(--accent);font-weight:600}
button:hover{filter:brightness(1.06)}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:auto;max-height:calc(100vh - 300px)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);border-bottom:2px solid var(--line);
  padding:9px 10px;text-align:left;font-weight:600;z-index:1;cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th:hover{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
tr:hover td{background:var(--accent-dim)}
td.name{white-space:normal;min-width:240px;max-width:380px}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline}
.blurb{font-size:11.5px;color:var(--muted);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;
  background:var(--accent-dim);color:var(--accent)}
.up{color:var(--accent);font-weight:600}
.down{color:var(--danger);font-weight:600}
.new{color:var(--warn);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;
  padding:10px 2px;font-size:13px;color:var(--muted);flex-wrap:wrap;gap:8px}
.pg{display:flex;gap:6px;align-items:center}
.msg{padding:28px;text-align:center;color:var(--muted)}
.msg.err{color:var(--danger)}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>Kickstarter 数据查询</h1>
  <span class="meta" id="dbinfo">载入中…</span>
  <div class="tabs">
    <button class="tab on" data-view="projects">项目筛选</button>
    <button class="tab" data-view="board">榜单</button>
    <button class="tab" data-view="stats">品类汇总</button>
  </div>
</header>
<main>

<!-- ============ 项目筛选 ============ -->
<section id="v-projects">
  <div class="filters">
    <div class="f"><label>关键词（名称/简介）</label><input id="q" placeholder="如 3d printer"></div>
    <div class="f"><label>大类</label><select id="parent"><option value="">全部</option></select></div>
    <div class="f"><label>子类</label><select id="category"><option value="">全部</option></select></div>
    <div class="f"><label>国家</label><select id="country"><option value="">全部</option></select></div>
    <div class="f"><label>状态</label><select id="state"></select></div>
    <div class="f"><label>已筹 ≥ (USD)</label><input id="min_usd" type="number" placeholder="0"></div>
    <div class="f"><label>已筹 ≤ (USD)</label><input id="max_usd" type="number" placeholder="不限"></div>
    <div class="f"><label>完成率 ≥ (%)</label><input id="min_pct" type="number" placeholder="0"></div>
    <div class="f"><label>支持者 ≥</label><input id="min_backers" type="number" placeholder="0"></div>
    <div class="f"><label>剩余天数 ≤</label><input id="days_left_max" type="number" placeholder="不限"></div>
    <div class="f"><label>上线日期 ≥</label><input id="launched_after" type="date"></div>
    <div class="f"><label>每页</label>
      <select id="page_size"><option>50</option><option>100</option><option>200</option><option>500</option></select>
    </div>
    <div class="acts">
      <button class="primary" id="go">查询</button>
      <button id="reset">重置</button>
      <button id="csv">导出 CSV</button>
      <span class="meta">点表头可切换排序</span>
    </div>
  </div>
  <div class="bar">
    <span id="count">—</span>
    <span class="pg">
      <button id="prev">上一页</button><span id="pginfo">1</span><button id="next">下一页</button>
    </span>
  </div>
  <div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
  <div class="msg hide" id="pmsg"></div>
</section>

<!-- ============ 榜单 ============ -->
<section id="v-board" class="hide">
  <div class="filters">
    <div class="f"><label>榜单</label><select id="bsort"></select></div>
    <div class="f"><label>显示前几名</label>
      <select id="btop"><option>50</option><option selected>100</option><option>300</option><option>1000</option></select>
    </div>
    <div class="acts"><button class="primary" id="bgo">查看</button>
      <span class="meta" id="bday"></span></div>
  </div>
  <div class="wrap"><table id="btbl"><thead></thead><tbody></tbody></table></div>
  <div class="msg hide" id="bmsg"></div>
</section>

<!-- ============ 品类汇总 ============ -->
<section id="v-stats" class="hide">
  <div class="filters">
    <div class="f"><label>维度</label>
      <select id="sby"><option value="parent">大类</option><option value="category">子类</option><option value="country">国家</option></select>
    </div>
    <div class="f"><label>范围</label>
      <select id="sstate"><option value="live">仅在筹中</option><option value="">全部历史</option></select>
    </div>
    <div class="acts"><button class="primary" id="sgo">统计</button></div>
  </div>
  <div class="wrap"><table id="stbl"><thead></thead><tbody></tbody></table></div>
  <div class="msg hide" id="smsg"></div>
</section>

</main>
<script>
const $ = s => document.querySelector(s);
const money = v => v==null ? '' : Math.round(v).toLocaleString();
const pctf  = v => v==null ? '' : (v>=100 ? Math.round(v).toLocaleString()+'%' : v.toFixed(1)+'%');
const esc   = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let META=null, state={page:1, sort:'pledged_usd', order:'desc'}, lastRows=[];

async function api(path, params){
  const u = new URL(path, location.origin);
  Object.entries(params||{}).forEach(([k,v])=>{ if(v!==''&&v!=null) u.searchParams.set(k,v); });
  const r = await fetch(u);
  const body = await r.json().catch(()=>({detail:'响应不是 JSON'}));
  if(!r.ok) throw new Error(body.detail || ('HTTP '+r.status));
  return body;
}
function showMsg(el, text, isErr){
  el.textContent = text; el.classList.remove('hide');
  el.classList.toggle('err', !!isErr);
}

// ---------- 初始化 ----------
async function init(){
  try{ META = await api('/api/meta'); }
  catch(e){ $('#dbinfo').textContent = '⚠ '+e.message; return; }

  $('#dbinfo').innerHTML = `共 <b>${META.totals.projects.toLocaleString()}</b> 个项目 ·
    快照 ${META.snapshots.map(s=>s.snapshot_date).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')}`;

  META.parents.forEach(p=>$('#parent').add(new Option(p,p)));
  META.countries.forEach(c=>$('#country').add(new Option(c,c)));
  $('#state').add(new Option('全部',''));
  META.states.forEach(s=>$('#state').add(new Option(s['状态'], s.state)));
  $('#state').value = 'live';
  META.rank_sorts.forEach(s=>$('#bsort').add(new Option(s.label, s.key)));

  $('#parent').onchange = ()=>{
    const p = $('#parent').value, sel = $('#category');
    sel.innerHTML = '<option value="">全部</option>';
    META.categories.filter(c=>!p||c['大类']===p).forEach(c=>sel.add(new Option(c['子类'], c['子类'])));
  };
  $('#parent').onchange();
  loadProjects();
}

// ---------- 项目筛选 ----------
const FIELDS = ['q','parent','category','country','state','min_usd','max_usd',
                'min_pct','min_backers','days_left_max','launched_after','page_size'];
const COLS = [
  {k:'name',  t:'项目', cls:'name', fmt:r=>`<a href="${r.project_url||'#'}" target="_blank" rel="noopener">${esc(r.name)}</a>`+
      (r.blurb?`<div class="blurb">${esc(r.blurb)}</div>`:'')},
  {k:'大类',  t:'大类'},
  {k:'子类',  t:'子类'},
  {k:'国家',  t:'国家'},
  {k:'状态',  t:'状态', fmt:r=>`<span class="pill">${esc(r['状态'])}</span>`},
  {k:'goal_usd',      t:'目标$',  num:1, sort:'goal_usd',      fmt:r=>money(r.goal_usd)},
  {k:'pledged_usd',   t:'已筹$',  num:1, sort:'pledged_usd',   fmt:r=>money(r.pledged_usd)},
  {k:'percent_funded',t:'完成率', num:1, sort:'percent_funded',fmt:r=>pctf(r.percent_funded)},
  {k:'backers_count', t:'支持者', num:1, sort:'backers_count', fmt:r=>(r.backers_count||0).toLocaleString()},
  {k:'days_remaining',t:'剩余天', num:1, sort:'days_remaining',fmt:r=>r.days_remaining==null?'':Math.round(r.days_remaining)},
  {k:'launched_at',   t:'上线日', num:1, sort:'launched_at',   fmt:r=>(r.launched_at||'').slice(0,10)},
];

function params(){
  const o = {sort:state.sort, order:state.order, page:state.page};
  FIELDS.forEach(f=>{ const v=$('#'+f).value; if(v) o[f]=v; });
  return o;
}
async function loadProjects(){
  $('#pmsg').classList.add('hide');
  try{
    const d = await api('/api/projects', params());
    lastRows = d.rows;
    $('#count').innerHTML = `匹配 <b>${d.total.toLocaleString()}</b> 条`;
    const pages = Math.max(1, Math.ceil(d.total/d.page_size));
    $('#pginfo').textContent = `${d.page} / ${pages}`;
    $('#prev').disabled = d.page<=1; $('#next').disabled = d.page>=pages;
    render($('#tbl'), COLS, d.rows);
    if(!d.rows.length) showMsg($('#pmsg'), '没有匹配的项目，放宽筛选条件试试');
  }catch(e){ showMsg($('#pmsg'), e.message, true); }
}
function render(tbl, cols, rows){
  tbl.querySelector('thead').innerHTML = '<tr>' + cols.map(c=>
    `<th class="${c.num?'num':''}" data-sort="${c.sort||''}">${c.t}${
      c.sort&&c.sort===state.sort ? (state.order==='desc'?' ↓':' ↑') : ''}</th>`).join('') + '</tr>';
  tbl.querySelector('tbody').innerHTML = rows.map(r=>'<tr>' + cols.map(c=>
    `<td class="${c.cls||''}${c.num?' num':''}">${c.fmt?c.fmt(r):esc(r[c.k])}</td>`).join('') + '</tr>').join('');
  tbl.querySelectorAll('th[data-sort]').forEach(th=>{
    const s = th.dataset.sort; if(!s) return;
    th.onclick = ()=>{
      state.order = (state.sort===s && state.order==='desc') ? 'asc' : 'desc';
      state.sort = s; state.page = 1; loadProjects();
    };
  });
}
$('#go').onclick    = ()=>{ state.page=1; loadProjects(); };
$('#prev').onclick  = ()=>{ state.page--; loadProjects(); };
$('#next').onclick  = ()=>{ state.page++; loadProjects(); };
$('#reset').onclick = ()=>{ FIELDS.forEach(f=>$('#'+f).value=''); $('#page_size').value='50';
                            $('#state').value='live'; $('#parent').onchange();
                            state={page:1,sort:'pledged_usd',order:'desc'}; loadProjects(); };
document.querySelectorAll('.filters input').forEach(i=>
  i.addEventListener('keydown', e=>{ if(e.key==='Enter'){ state.page=1; loadProjects(); }}));

$('#csv').onclick = ()=>{
  if(!lastRows.length) return;
  const keys = Object.keys(lastRows[0]);
  const csv = [keys.join(','), ...lastRows.map(r=>keys.map(k=>{
    const v = r[k]==null?'':String(r[k]);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = `kickstarter_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};

// ---------- 榜单 ----------
const BCOLS = [
  {k:'rank', t:'#', num:1},
  {k:'move', t:'变动', num:1, fmt:r=> r.is_new_entry ? '<span class="new">NEW</span>'
      : r.rank_gain>0 ? `<span class="up">↑${r.rank_gain}</span>`
      : r.rank_gain<0 ? `<span class="down">↓${-r.rank_gain}</span>` : '—'},
  {k:'name', t:'项目', cls:'name', fmt:r=>`<a href="${r.project_url||'#'}" target="_blank" rel="noopener">${esc(r.name)}</a>`+
      (r.blurb?`<div class="blurb">${esc(r.blurb)}</div>`:'')},
  {k:'大类', t:'大类'}, {k:'子类', t:'子类'}, {k:'国家', t:'国家'},
  {k:'pledged_usd', t:'已筹$', num:1, fmt:r=>money(r.pledged_usd)},
  {k:'goal_usd', t:'目标$', num:1, fmt:r=>money(r.goal_usd)},
  {k:'percent_funded', t:'完成率', num:1, fmt:r=>pctf(r.percent_funded)},
  {k:'backers_count', t:'支持者', num:1, fmt:r=>(r.backers_count||0).toLocaleString()},
  {k:'days_remaining', t:'剩余天', num:1, fmt:r=>r.days_remaining==null?'':Math.round(r.days_remaining)},
];
async function loadBoard(){
  $('#bmsg').classList.add('hide');
  try{
    const d = await api('/api/leaderboard', {sort:$('#bsort').value, top:$('#btop').value});
    $('#bday').textContent = d.day ? `快照日期 ${d.day}` : '';
    render($('#btbl'), BCOLS, d.rows);
    if(!d.rows.length) showMsg($('#bmsg'), d.hint || '这个榜还没有数据');
  }catch(e){ showMsg($('#bmsg'), e.message, true); }
}
$('#bgo').onclick = loadBoard;

// ---------- 品类汇总 ----------
const SCOLS = [
  {k:'维度', t:'维度'},
  {k:'项目数', t:'项目数', num:1, fmt:r=>(r['项目数']||0).toLocaleString()},
  {k:'募集总额USD', t:'募集总额$', num:1, fmt:r=>money(r['募集总额USD'])},
  {k:'募集中位USD', t:'募集中位$', num:1, fmt:r=>money(r['募集中位USD'])},
  {k:'目标中位USD', t:'目标中位$', num:1, fmt:r=>money(r['目标中位USD'])},
  {k:'平均完成率', t:'平均完成率', num:1, fmt:r=>pctf(r['平均完成率'])},
  {k:'支持者总数', t:'支持者总数', num:1, fmt:r=>(r['支持者总数']||0).toLocaleString()},
];
async function loadStats(){
  $('#smsg').classList.add('hide');
  try{
    const d = await api('/api/stats', {by:$('#sby').value, state:$('#sstate').value});
    render($('#stbl'), SCOLS, d.rows);
    if(!d.rows.length) showMsg($('#smsg'), '没有数据');
  }catch(e){ showMsg($('#smsg'), e.message, true); }
}
$('#sgo').onclick = loadStats;

// ---------- 视图切换 ----------
document.querySelectorAll('.tab').forEach(t=>t.onclick = ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
  ['projects','board','stats'].forEach(v=>
    $('#v-'+v).classList.toggle('hide', v!==t.dataset.view));
  if(t.dataset.view==='board' && !$('#btbl tbody').innerHTML) loadBoard();
  if(t.dataset.view==='stats' && !$('#stbl tbody').innerHTML) loadStats();
});

init();
</script>
</body>
</html>
